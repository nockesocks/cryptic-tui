# One share per mounted stick, written to shares.conf by cryptic_vaults.py. Loopback only: Colima forwards it to the Mac.
[global]
  smb ports = 4450
  interfaces = lo
  bind interfaces only = yes
  disable netbios = yes
  server min protocol = SMB3
  map to guest = never
  load printers = no
  valid users = cryptic-vaults
  force user = cryptic-vaults
  force group = cryptic-vaults
  read only = no
  vfs objects = fruit streams_xattr
  include = /etc/samba/shares.conf
