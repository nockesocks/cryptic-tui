# One share per mounted stick, written to shares.conf by cryptic.py. Loopback only: Colima forwards it to the Mac.
[global]
  smb ports = 4450
  interfaces = lo
  bind interfaces only = yes
  disable netbios = yes
  server min protocol = SMB3
  map to guest = never
  load printers = no
  valid users = cryptic
  force user = cryptic
  force group = cryptic
  read only = no
  vfs objects = fruit streams_xattr
  include = /etc/samba/shares.conf
